<div class="demo-backdrop">
    <div class="notif-popup" id="notifPopup">
        <div class="notif-header">
            <div class="notif-header-right">
                <div class="notif-header-icon"><i class="fas fa-bell"></i></div>
                <div>
                    <h5>مركز الإشعارات</h5>
                </div>
            </div>
            <button class="btn-close-custom" (click)="dismissModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="notif-toolbar">
            <div class="notif-tabs">
                <button class="notif-tab">
                     الكل <span class="badge-tab">{{TotalCount}}</span>
                </button>
            </div>
        </div>
        <div class="notif-list" id="notifList">
            <div class="notif-item" data-type="all unread" [ngClass]="{'unread': !item.isRead}" *ngFor="let item of NotificationList">
                <div class="unread-dot" *ngIf="!item.isRead"></div>
                <div class="notif-avatar" [ngClass]="getProviderClass(item.provider)">
                    <span *ngIf="item.provider">👝</span>
                    <span *ngIf="!item.provider">⚠️</span>
                    <span class="notif-type-badge" style="background:var(--danger);color:#fff;" *ngIf="item.provider == 'VodafoneCash'"><i class="fas fa-arrow-up"></i></span>
                    <span class="notif-type-badge" style="background:var(--info);color:#fff;" *ngIf="item.provider == 'InstaPay'"><i class="fas fa-arrow-up"></i></span>
                    <span class="notif-type-badge" style="background:var(--danger);color:#fff;" *ngIf="!item.provider"><i class="fas fa-exclamation-triangle"></i></span>
                </div>
                <div class="notif-content">
                    <div class="notif-name">{{item.title}}</div>
                    <div class="notif-body">
                        {{item.body}}
                    </div>
                    <div class="notif-meta">
                        <span class="notif-time"><i class="fas fa-clock"></i> {{item.createdAt | timeAgoToday}}</span>
                        <span class="notif-chip c-red" *ngIf="item.provider == 'VodafoneCash'">فودافون كاش</span>
                        <span class="notif-chip c-blue" *ngIf="item.provider == 'InstaPay'">انستا باي</span>
                        <span class="notif-chip c-orange" *ngIf="!item.provider">النظام</span>
                    </div>
                </div>
            </div>
            <div class="loading-more" *ngIf="ShowLoader">
                <i class="fas fa-spinner fa-spin"></i> جاري تحميل المزيد...
            </div>
            <div #observer></div>
